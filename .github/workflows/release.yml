name: Release

# After CI passes on main, a commit whose package.json `version` has no release yet is built,
# deployed to GitHub Pages and published as the GitHub Release `v<version>`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# GitHub keeps one queued run: if several bumps merge while a release runs, the middle one is
# skipped and its pull requests appear in the next release's notes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # Releases only commits on main that passed CI; a manual run must also start from main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      is-new: ${{ steps.version.outputs.is-new }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - id: version
        name: Decide whether this version needs a release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if output="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
            echo "$tag is already released; nothing to do."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q "release not found" <<< "$output"; then
            echo "Could not check $tag: $output"
            exit 1
          fi

          # A lower or equal version than the latest release is a mistake, not a release.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo v0.0.0)"
          node -e '
            const parse = (tag) => tag.replace(/^v/, "").split(".").map(Number)
            const [next, latest] = [parse(process.argv[1]), parse(process.argv[2])]
            const diff = next.map((part, index) => part - latest[index]).find((part) => part !== 0) ?? 0
            if (diff <= 0) {
              console.error(`${process.argv[1]} is not greater than the latest release ${process.argv[2]}`)
              process.exit(1)
            }
          ' "$tag" "$latest"
          echo "is-new=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA fallback; serving index.html as 404.html keeps deep links working.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    # Published after the deploy, so a release always matches the live demo.
    needs: [check, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page-url }}
        run: |
          # Notes list the pull requests merged since the previous release, with the demo link on top.
          changes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body)"
          printf 'Demo: %s\n\n%s\n' "$PAGE_URL" "$changes" > release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" \
            --notes-file release-notes.md
