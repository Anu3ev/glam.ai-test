name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint src e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Bootstrap: CI renders missing baselines in its own environment and uploads them to be committed.
      - run: npx playwright test --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-baselines
          path: e2e/tests/__screenshots__
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
